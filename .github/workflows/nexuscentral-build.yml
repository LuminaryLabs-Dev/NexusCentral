name: NexusCentral Legacy V1 Build

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/scripts/discover-nexuscentral.ps1"
      - ".github/scripts/publish-nexuscentral.ps1"
      - "global.json"
      - "updates/release-targets.json"
      - "packages/**"
      - "NexusCentral-V1/**"
  pull_request:
    paths:
      - ".github/scripts/discover-nexuscentral.ps1"
      - ".github/scripts/publish-nexuscentral.ps1"
      - "global.json"
      - "updates/release-targets.json"
      - "packages/**"
      - "NexusCentral-V1/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      version_dirs: ${{ steps.discover.outputs.version_dirs }}
      targets: ${{ steps.discover.outputs.targets }}
      dotnet_sdk: ${{ steps.discover.outputs.dotnet_sdk }}
      configuration: ${{ steps.discover.outputs.configuration }}
      self_contained: ${{ steps.discover.outputs.self_contained }}
      artifact_retention_days: ${{ steps.discover.outputs.artifact_retention_days }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Discover version lanes and targets
        id: discover
        shell: pwsh
        run: ./.github/scripts/discover-nexuscentral.ps1

  build:
    needs: discover
    name: ${{ matrix.version_dir }} ${{ matrix.target.rid }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        version_dir: ${{ fromJson(needs.discover.outputs.version_dirs) }}
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.discover.outputs.dotnet_sdk }}
      - name: Publish target
        shell: pwsh
        run: >
          ./.github/scripts/publish-nexuscentral.ps1
          -VersionDir "${{ matrix.version_dir }}"
          -Runtime "${{ matrix.target.rid }}"
          -Configuration "${{ needs.discover.outputs.configuration }}"
          -SelfContained $${{ needs.discover.outputs.self_contained }}
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nexuscentral-${{ matrix.version_dir }}-${{ matrix.target.rid }}
          path: |
            artifacts/archives/*.zip
            artifacts/manifests/*.size.json
          if-no-files-found: error
          retention-days: ${{ needs.discover.outputs.artifact_retention_days }}
